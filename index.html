<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf7f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>우리의 추억 퀴즈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="pop-layer" aria-hidden="true"></div>

  <main id="app">
    <!-- 시작 화면 -->
    <section id="screen-start" class="screen active">
      <svg class="doodle-heart" viewBox="0 0 64 58" aria-hidden="true">
        <path d="M32 54C14 41 5 31 5 19 5 10 12 4 20 4c5 0 9 3 12 7 3-4 7-7 12-7 8 0 15 6 15 15 0 12-9 22-27 35z" />
      </svg>
      <p id="greeting" class="greeting"></p>
      <h1 id="title"></h1>
      <p id="subtitle" class="subtitle"></p>
      <button id="btn-start" class="btn primary">시작하기</button>
    </section>

    <!-- 퀴즈 화면 -->
    <section id="screen-quiz" class="screen">
      <div class="progress">
        <div id="dots" class="dots"></div>
        <div id="step" class="step"></div>
      </div>
      <div id="card" class="card">
        <p class="q-label">Q<span id="q-num"></span></p>
        <h2 id="question"></h2>
        <div id="choices" class="choices"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </div>
    </section>

    <!-- 정답 & 추억 공개 화면 -->
    <section id="screen-memory" class="screen">
      <p class="correct-badge">정답</p>
      <div class="polaroid">
        <span class="tape" aria-hidden="true"></span>
        <div id="photo-box" class="photo-box"></div>
        <p id="memory" class="memory"></p>
      </div>
      <button id="btn-next" class="btn primary">다음 문제</button>
    </section>

    <!-- 편지 화면 -->
    <section id="screen-letter" class="screen">
      <p id="letter-hint" class="subtitle">마지막으로 편지가 하나 있어.<br />눌러서 열어 봐.</p>
      <button id="envelope" class="envelope" aria-label="편지 열기">
        <span class="flap"></span>
        <svg class="seal" viewBox="0 0 64 58" aria-hidden="true">
          <path d="M32 54C14 41 5 31 5 19 5 10 12 4 20 4c5 0 9 3 12 7 3-4 7-7 12-7 8 0 15 6 15 15 0 12-9 22-27 35z" />
        </svg>
      </button>
      <article id="letter" class="letter hidden">
        <p id="letter-text"></p>
        <p id="letter-sign" class="sign"></p>
        <p id="final-surprise" class="surprise"></p>
        <button id="btn-replay" class="btn ghost">처음부터 다시 하기</button>
      </article>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
