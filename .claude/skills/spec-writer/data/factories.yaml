# 공장별 · 설비(라인)별 제품 사양
# - 시방서 "제품사양 > 1) Pipe Size" 표가 여기서 채워집니다.
# - content.yaml 에서 factory / line 으로 고르고, 필요하면 content.yaml 의 pipe_size 로 덮어씁니다.
# - 표기 형식: [Min, Max, 비고]  (비고는 생략 가능)

포항공장:
  company: ㈜세아제강                 # 표지·머리말에 들어가는 회사명
  warranty_site: 세아제강 포항 공장   # Warranty 항목 "엔지니어는 즉각 ○○○에 출장" 문구
  lines:
    PM22:
      name: PM22 조관라인
      pipe_size:
        외 경: ["3”(Ф88.9mm)", "8’(Ф225.0mm)"]   # 원본 그대로 옮김 — 인치 기호(”)·치수 확인 필요
        두 께: ["5.0mm", "18.3mm"]
        길 이: ["5M", "18.3M"]
    JCOE 12M:
      name: JCOE 12M
      pipe_size:
        외 경: ["18”(Ф457mm)", "64”(Ф1625.6mm)"]
        두 께: ["8.0mm", "38.1mm"]
        길 이: ["6M", "18.3M"]
    A동창고:
      name: PM51 A동창고 포장
      pipe_size:
        외 경: ["8”(Ф203.2mm)", "20”(Ф508mm)"]   # 원본 시방서 표기 20’ → 20” 로 정정
        두 께: ["4.8mm", "14mm"]
        길 이: ["5.5M", "19.3M"]
    # JCOE 18M:
    #   pipe_size:
    #     외 경: ["", ""]
    #     두 께: ["", ""]
    #     길 이: ["", ""]

