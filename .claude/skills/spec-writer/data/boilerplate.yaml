# 매 시방서에 공통으로 들어가는 고정 문구
# - content.yaml 에서 같은 키(install, misc, docs ...)를 쓰면 이 기본값 대신 그 내용이 들어갑니다.
# - {sec:키} 는 빌드 때 실제 장 번호로 바뀝니다. (spec, env, scope, detail, install, misc, docs, warranty, common)
# - 블록 문법은 references/schema.md 참고

# 설치환경 (고정)
env:
  - "1) Ambient temperature   : -15℃ ~ 40℃"
  - "2) Operation temperature  : -10℃ ~ 40℃"
  - "3) Relative humidity       : Max 85%(average)"
  - "4) Altitude                : Not to exceed 1,000meters above sea level."

# "공급 설비별 세부 사양" 제목 뒤 괄호 문구
detail_note: (상세 내용은 필히 협의 후 설계/제작할 것)

# 공급 범위 구분 표 기본 행 [항목, 세아제강, 수주처, 비고]
scope:
  - [생산 제품 및 사양 확정, O, "", ""]
  - [현장 체크 및 구성도 작성, "", O, ""]
  - [구성도 승인, O, "", ""]
  - [제 작, "", O, ""]
  - [검 수, O, "", ""]
  - [납품 및 운송, "", O, ""]
  - [시스템 설치, "", O, ""]
  - [시운전, △, O, ""]
  - [문제점 보완, △, O, ""]

# 세부 사양 마지막 소항목 (content.yaml 에서 safety_permits: false 로 끌 수 있음)
safety_permits:
  title: 안전관련 인허가 서류
  blocks:
    - "A. 자율안전 확인신고: 신고 및 증명서 제출"
    - "B. 안전검사: 안전검사 신청 / 수행 및 안전검사 합격증명서 발급"
    - "C. 공급되는 설비 및 자재 일체는 안전 인증을 받은 제품을 사용 할 것 (성적서 제출)"
    - "※ 이 외에 필요한 제반 서류가 있다면 일체 준비 및 허가를 받도록 한다"

# 설치 공사 및 시운전
install:
  - title: 기계 설치
    blocks:
      - "- 설치 범위"
      - ": 기계장치 설치 외 (환경설비 설치 제외, 전기공사를 제외한 모든 기계/유압장치 설치)"
      - "- 모든 설치 자재는 도급 기준, 사전 현장 확인 및 준비 할 것"
      - ": 앙카 볼트 등 볼팅류에서 절단용 산소 등 설치에 필요한 일체 자재 도급"
      - ": 단, 현장 설치 공사 시 필요한 공압 배관자재(백관)는 당사에서 사급 한다."
      - "* 공사투입 1개월 전 당사에 필요 자재 리스트 필히 제출 할 것."
      - "- 발생된 폐기물은 당사 지정 위치에 이적하며, 수주자측 자재 환경 폐기물은 수거/반출"
      - "- 설비 설치 후 모든 볼트는 한번 더 체결/확인하여, 풀림이 없도록 할 것"
      - "- 시방의 내용과 변경 사항 발생시 담당자와 협의 후 시행 할 것"
  - title: 공통 사항
    blocks:
      - "- 수주처에서 신설한 설비와 연계부분에 대한 부분 수정 등 일체를 포함함"
      - "- 상업생산 시작 후 4주간 작업자 2명을 배치하여 돌발 발생 문제점에 대해서 대응함"
      - "- 문제점 발생시 담당자와 협의하여 즉시 조치함"
      - "- 시방에 포함되지 않더라도 설비에 문제가 발견되면 수정 / 보완함"
      - "- 당사 규정에 의거하여 작업허가서, 크레인 대여, 산재 가입증명서 등 관련 서류 일체를 제출함"
  - title: 시운전
    blocks:
      - "- 설비 시운전시 발생된 문제에 대해서 즉시 조치 실시 할 것"
      - "- 시운전 : 기계/유압 일체 작동TEST 외"
      - "- 시운전 중 수정사항 발생시 수주자는 즉각 조치할 것"
      - "- 설비 시운전 중 수주자의 잘못으로 파손된 부품은 수주자의 무상수리가 원칙임"
      - "- 설비 시운전에 적극적인 참여로 조기 안정화 시행"
      - "- 공사 완료 후 제품 충돌 및 이탈 문제 발생시 즉시 조치"
      - "- 보완 사항 및 문제점 발생시 적극 참여하여, 충분한 기능을 하도록 협조할 것"
      - "- 모든 시운전의 완료는 최소 및 최대 외경, 최소 길이 및 최대 길이에 대해서 각각 1주일 불가동이 없이 생산이 가능할 때 시운전 완료로 규정함"

# 기타사항
misc:
  - 상기에 기술되지 않았지만, 생산에 필요한 장치 또는 시스템인 경우 수주처는 설계에 반영할 것.
  - 수정사항이 발생하였을 경우 수주자는 즉각 조치하며, 설치 중 수정된 사항에 대해 반드시 도면을 수정하여 제출한다.
  - 본 사양서 및 도면에 충분히 명기되지 않은 사항은 필히 당사의 승인을 득한 후 설계, 제작에 반영.
  - 제작 착수 전에 반드시 발주처의 승인을 득하고 실시한다.
  - 발주 후 전체 일정 계획표를 작성 제출하고, 매월 말일 진행현황을 작성 제출한다.
  - 입고 설비에 대한 모든 볼트는 고장력 볼트를 사용한다.
  - 모든 부품은 가공 후, 치수 검사를 실시한 후에 조립한다. (검사 Report 제출 할 것)
  - 모든 단위 설비는 입고 전 Test를 실시한다 (Testing Report 제출 할 것)
  - 검수의 완료는 Shop-Test를 실시하여 설비의 기능을 충분히 발휘하는 시점으로 한다

# 문서
docs:
  - 기계 도면 일체 (전체/파트 조립도, 부품도, 기초도, 유압회로도)
  - 모든 도면은 USB 파일 및 A3 출력 3부 제출 할 것.
  - 통합 OP, 셋팅 방법 매뉴얼 작성 및 제출할 것 (파일 및 책자 3부)

# Warranty (고정) — {warranty_site} 는 factories.yaml 값으로 바뀜
warranty:
  - title: "Warranty 기간 : 1년"
    blocks:
      - "-. 설비이상 발생 시에 엔지니어는 즉각 {warranty_site}에 출장을 가야 한다."
      - "-. 본 설비는 상업 생산 후에 1년간 부품의 파손 등이 없이 가동이 되도록 내구성이 검증 되어야 한다.\n(단, 작업자의 실수 등에 의해 발생한 경우는 제외를 한다.)"
      - "-. 시운전 완료 후 하자보증 이행서를 제출한다."
  - title: F.A.T
    blocks:
      - "-. 모든 시운전의 완료는 최소 및 최대 외경, 최소 길이 및 최대 길이에 대해서 각각 1주일 문제없이 생산이 가능할 때 시운전 완료로 규정함."
      - "* {{red}}시운전 완료 기준 (1주일간 연속 가동 기준 가동률 95% 이상 충족){{/red}}"
      - "* 불가동이 당사 작업자의 스킬 또는 실수에 따른 것은 제외한다."
      - "-. 모든 도면, 문서, PLC 프로그램은 암호화 및 LOCK 해제 후 공급할 것"
