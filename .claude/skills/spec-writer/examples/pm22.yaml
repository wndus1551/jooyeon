details:
  - title: PM22 업세트 내면비드커터 압력 제어 시스템 (I/O Link 적용)
    blocks:
      - "# 개요 및 목적"
      - "- I/O Link 릴리프 밸브를 적용하여 아래 기능을 구현할 것"
      - ": 작업자 제품 레시피별 치수 및 세팅압 설정 관리 가능하도록 구성할 것"
      - ": 레시피 선택 시 해당 제품 설정압(하부레버 압력, 쵸핑압)으로 자동 변경되도록 구성할 것"
      - "→ I/O Link 릴리프 밸브용 압력 센서 추가하여 실시간 압력 모니터링 가능하도록 구성할 것"
      - ": 하부레버 ON/OFF 시에만 압력을 서서히 상승/하강(램프)시켜 완충 기능을 수행하도록 할 것"
      - "→ 압력 상/하강 속도는 수요가 요구에 맞게 세팅하되, 필요시 상/하강 속도 조절 기능 추가할 것"
      - "- 작업자 PC 내에서 조작/표시/알람이 가능하도록 연동하고, 프로그램 내에 I/O Link의 진단 기능(이벤트, 상태 정보)을 유지할 것"

      - "# 시스템 구성"
      - table:
          header: [구 분, 구성품, 역 할]
          widths: [18, 43, 39]
          rows:
            - [하부레버 압력, I/O Link 릴리프 밸브 (하부레버용) 1EA, 레버 ON/OFF 시 램프 압력 제어]
            - [쵸핑압, I/O Link 릴리프 밸브 (쵸핑압 조절용) 1식, 레시피별 설정압 제어]
            - [통신(마스터), I/O Link 통신 모듈 Box (4 Port), "밸브와 M12 연결, 설정값 송신/상태 수신"]
            - [상위 제어, 기존 PLC / OP-DESK HMI, "레시피 선택, 램프 로직, 조작, 알람 표시"]
            - [모니터링(선택), "Gateway (데이터 수집용, 협의 후 적용)", 이력/추세 수집 (제어 명령 기능 제외)]
      - "- 신호 흐름 : 하부레버 ON/OFF 및 레시피 선택 → PLC → (램프 연산) → I/O Link 마스터 → I/O Link 릴리프 밸브"
      - "- 하부레버 ON/OFF 신호는 PLC 입력으로 수신하여 램프를 생성하고, 설정압 명령값을 I/O Link 데이터로 밸브에 전달할 것"
      - "- 조작/램프 제어 경로는 PLC 경로로 구성하고, Gateway는 모니터링 용도로 한정할 것 (Gateway 이상 시에도 설비 제어는 유지되어야 함)"

      - "# 기능 사양"
      - "## 제품 레시피별 압력 자동 변경"
      - "- HMI에서 제품 레시피(외경/두께 구분)를 선택하면, PLC가 해당 레시피의 설정압을 I/O Link를 통해 밸브에 자동 전달할 것"
      - "- 레시피별 설정압 항목 : 하부레버 설정압, 쵸핑압 설정압 (적용 대상 압력 항목은 협의하여 확정)"
      - table:
          header: [레시피, 외 경, 두 께, 설정압, 비 고]
          widths: [15, 18, 18, 21, 28]
          align: [c, c, c, c, l]
          rows:
            - [No. 01, 당사 제공, 당사 제공, 시운전 시 확정, 레시피 수량은 협의]
            - [No. 02, 당사 제공, 당사 제공, 시운전 시 확정, ""]
            - [… No. N, "", "", "", ""]
      - "- 레시피 설정값은 HMI에서 수정/저장 가능하도록 하되, 수정 권한을 구분하고 PLC에서 상한/하한을 이중으로 제한할 것"
      - "- 레시피 변경 이력(일시, 변경 항목, 변경 전/후 값)을 저장하여 조회 가능하도록 할 것"
      - "- 하부레버 ON 중 레시피 변경 시의 처리(변경 금지 또는 OFF 후 적용)는 인터록으로 구성할 것 (방식은 협의 후 결정)"
      - "- 레시피 변경 후에도 설비 전원 차단/복귀 시 마지막 레시피와 설정값이 유지될 것"
      - "## 하부레버 ON/OFF 완충(램프) 제어"
      - "- 하부레버 ON 시 : 설정압 명령을 0%(0V 상당)에서 레시피 설정압(최대 5V 상당)까지 서서히 상승시킬 것 (1V → 2V → 3V → 4V → 5V 상당의 연속 상승)"
      - "- 하부레버 OFF 시 : 설정압 명령을 현재 값에서 0%(최저압)까지 서서히 하강시킬 것"
      - "- 램프는 ON/OFF 천이 구간에만 적용하고, 설정압 도달 후 유지 구간 및 레시피 값 반영에는 적용하지 않아 제어 응답 지연이 없도록 할 것"
      - "- 램프업 / 램프다운 시간은 각각 HMI에서 설정/변경 가능할 것 (예상 Spec - 조정 범위 0.1 ~ 5.0초, 초기값은 시운전 시 확정, 상세 Spec 협의 必)"
      - "- 램프 곡선이 계단 형태로 나타나지 않도록 갱신 주기를 I/O Link 사이클 타임과 PLC 스캔타임을 고려하여 설정할 것 (갱신 주기 협의)"
      - "- 램프 진행 중 하부레버가 반대로 조작될 경우, 현재 압력값에서 목표 방향으로 연속 전환하여 압력이 급변하지 않도록 할 것"
      - "- 램프는 PLC 로직에서 생성함을 기본으로 하며, 밸브 내부 램프 기능을 사용하는 경우 PLC와 이중으로 램프가 걸리지 않도록 사전에 협의할 것"
      - "- 비상정지 및 설비 이상 시에는 램프를 적용하지 않고 즉시 안전 측(최저압/무부하 등)으로 전환되도록 할 것 (안전 측 상태는 유압회로 확인 후 확정)"
      - "## 이상 시 동작 (Fail-safe)"
      - "- 통신 단절, 밸브 이상, 전원 이상 시 밸브의 최종 압력 상태(유지/최저압/최고압)를 사양서로 제출하고, 최고압으로 상승하는 구조는 적용 불가"
      - "- 램프 진행 중 통신이 단절되더라도 중간 압력에서 정지하지 않고 안전 측으로 복귀하도록 PLC 및 밸브 파라미터를 설정할 것"
      - "- 이상 발생 시 PLC가 램프를 중단하고 HMI에 알람을 표시할 것"
      - "## HMI(OP-DESK) 표시 및 조작"
      - "- 표시 항목 : 현재 선택 레시피, 설정압, 실제 압력(센서 적용 시), 하부레버 상태, 램프 진행 상태, I/O Link 포트별 통신 상태"
      - "- 조작 항목 : 레시피 선택, 레시피 설정값 수정, 램프 시간 설정 (권한 구분 적용)"
      - "- 진단 항목 : 밸브 이벤트(발생/해제 시각 포함) 및 장치 상태(정상/점검 필요/사양 이탈/고장)를 PLC에서 수신하여 알람 이력으로 저장하고 표시할 것"
      - "※ 이벤트는 발생 시점에 1회만 전달되므로, 순간 이상도 놓치지 않도록 PLC에서 래치 및 이력 처리할 것"

      - "# I/O Link 구성 사양"
      - "- 릴리프 밸브는 설정압 가변형(비례 압력 제어형)이며, I/O Link를 통해 설정값을 쓰고 상태를 읽을 수 있는 제품일 것"
      - "- 밸브 선정 시 아래 자료를 제출하여 당사 승인 후 제작할 것"
      - ": IODD 파일, 데이터시트, 프로세스 데이터 구성(설정값/실제값/상태), 이벤트 코드표"
      - ": 신호-압력 특성(0%, 100% 시 압력값, 정/역특성), 통신/전원 이상 시 압력 상태"
      - ": 소비 전류 및 포트 Class(A/B), 밸브 내부 램프 파라미터 유무"
      - "- I/O Link 통신 모듈 Box는 4 Port로 구성하며, 포트 배정(안)은 아래와 같음 (확정은 협의)"
      - table:
          header: [Port, 연결 대상, 비 고]
          widths: [16, 42, 42]
          rows:
            - [Port 1, 릴리프 밸브 (하부레버용), I/O Link 모드]
            - [Port 2, 릴리프 밸브 (쵸핑압 조절용), I/O Link 모드]
            - [Port 3, 예비 (계통 압력 센서 등 확장용), 사용 여부 협의]
            - [Port 4, 예비, ""]
      - "- 마스터의 데이터 스토리지(파라미터 서버) 기능을 활성화하여, 밸브 교체 시 설정이 자동 복원되도록 할 것"
      - "- PLC 연동 방식(필드버스 종류)은 {sec:common}항 Common List의 PLC(LS XGT Series)와 연동 가능한 방식으로 선정하며, 최종 통신 방식은 당사 전기 담당 확인 후 통보함"
      - "- 밸브 및 마스터 제조사는 {sec:common}항 Common List의 유압 밸브/전기부품 제조사 기준으로 하되, 해당 사양이 없는 경우 협의 후 당사 승인을 받을 것"
      - "- Gateway 병행 적용 시 마스터가 PLC 연동과 Gateway 연동을 동시에 지원해야 하며, 동시 지원이 불가능한 경우 PLC 연동을 우선할 것"
      - "- 압력 센서 추가(선택)는 실제 압력 확인 및 이상 판별 목적으로 협의하여 결정하되, 센서 값은 PLC를 통해 설정값과 비교하여 HMI에 표시할 것"
      - "- IO Link 및 Gateway의 계정/비밀번호 변경, 불필요 포트 비활성화, 설정 백업 방법을 제공하고 제어망과 정보망을 분리하여 구성할 것 (무선 통신 사용 시 사전 승인)"

      - "# 통신 모듈 Box 제작 및 정비 요건"
      - "- Box 입력 전원단에 퓨즈 또는 차단기를 설치하고, 충전부는 핑거세이프 커버로 보호할 것"
      - "- Box 내 모든 금속 부품 및 DIN 레일은 PE 접지를 연결하고, 접지 연결 상태를 점검 항목에 포함할 것"
      - "- Port 번호, 전선 번호, 전원 정격을 라벨로 표기하고 배선은 덕트/타이로 고정하며 선단에는 페룰을 사용할 것"
      - "- 미사용 M12 포트에는 보호 캡을 설치하여 방진/방수 등급을 유지하고, 설치환경({sec:env}항)에 적합한 Box 보호등급을 적용할 것"
      - "- 24V 전원 용량은 전 포트 사용 시 합계 전류에 여유를 두어 선정하고 발열을 고려할 것"
      - "- 정비 편의를 위해 마스터/전원/Gateway는 DIN 레일 방식으로 구성하여 개별 교체가 가능하도록 할 것"
      - "- 현장 전기 배선 공사는 {sec:install}-1항 설치 범위에 따라 당사에서 시행하며, 수주처는 결선도 및 포트 배정표를 제공하고 결선 입회 및 통신 확인을 지원할 것"
      - "- PLC/HMI 프로그램(레시피, 램프, 알람) 작성 및 수정은 수주처 범위로 하되, 기존 프로그램 변경 시 사전에 당사 승인을 받을 것"

      - "# 안전 기능 분리"
      - "- I/O Link 신호는 안전 등급 신호가 아니므로, 설비 보호/인터록/비상정지는 I/O Link 경로에 의존하지 않고 기존 하드와이어 안전 회로를 유지할 것"
      - "- 과압 보호용 기계식 릴리프 밸브는 기존대로 유지하며, 비례 릴리프 밸브 및 램프 제어 고장 시에도 과압이 발생하지 않도록 할 것"
      - "- 압력 설정값 변경 권한을 구분하고, 설정 가능한 압력의 상한/하한을 PLC에서 제한할 것"

      - "# 시운전 및 검수 시험 항목"
      - table:
          header: [시험 항목, 시험 내용, 확인 사항]
          widths: [24, 48, 28]
          rows:
            - [레시피 압력 변경, 전체 레시피 선택 시 설정압 자동 반영 확인, 설정압/실제압 일치]
            - [램프 업/다운, 하부레버 ON/OFF 시 압력 파형을 기록하고 즉시 인가 대비 충격 저감 확인, "압력 파형, 충격 육안 확인(당사 입회)"]
            - [연속 조작, 하부레버 ON/OFF 반복 및 램프 중 반대 조작, 압력 급변 없음]
            - [레시피 인터록, 하부레버 ON 중 레시피 변경 시도, 설정된 방식대로 동작]
            - [통신 단절, 케이블 분리 및 마스터 전원 차단 시 거동 확인, "안전 측 전환, 알람 표시"]
            - [전원 차단/복귀, 전원 차단 후 복귀 시 압력 상태 및 레시피 유지, 이상 압력 상승 없음]
            - [이벤트/알람, 밸브 이벤트 발생/해제의 HMI 표시 및 이력, 순간 이상도 이력 저장]
            - [밸브 교체, 밸브 교체 후 설정 자동 복원 확인, 파라미터 복원]
            - [연속 가동, 최소/최대 외경 레시피 각각 연속 생산, "{sec:install}-3항 시운전 완료 기준 적용"]
      - "- 시험 결과(압력 파형 포함)는 Testing Report로 작성하여 제출할 것 ({sec:misc}-8항)"

      - "# 제출 문서"
      - "- I/O Link 밸브/마스터/Gateway 사양서, IODD, 이벤트 코드표 및 알람 리스트"
      - "- Port 배정표, 결선도, 유압회로도(비례 릴리프 밸브 포함), 레시피별 설정압 표"
      - "- PLC I/O 리스트 및 통신 맵(프로세스 데이터, 파라미터 접근), HMI 화면 구성서"
      - "- 밸브 교체/설정 복원 절차서, 정비 점검 절차서, 통신 이상 시 점검 순서(LED 상태별 의미 포함)"

