# 예시 1 : PM22 업세트 내면비드커터 압력 고도화 개선 (26.10.21 시방서를 이 형식으로 옮긴 것)
# - 26.10.28 개정 : 컨셉 변경
#   PLC + OP-DESK HMI 연동, I/O Link 릴리프 밸브 교체  →  EonGate(원격 관리 게이트웨이) 기반 I/O Link 단독 통신,
#   기존 릴리프 밸브 존치 + 벤트 포트에 비례 파일럿 밸브 추가, 작업자 운전 UI(현장 태블릿·PC) / 원격 모니터링
#   I/O Link 배선 길이 제약(최대 20m)으로 마스터를 쵸핑측·하부레버측 2식으로 분산, 게이트웨이까지는 Ethernet 집선
#   MES 연계는 2단계 과제 (본 건 범위 외)
