details:
  - title: PM22 업세트 내면비드커터 압력 제어 시스템 (EonGate 기반 I/O Link 적용)
    blocks:
      - "# 개요 및 목적"
      - "- 쵸핑 유압유니트와 하부레버 유압유니트의 기존 릴리프 밸브는 존치하고, 각 릴리프 밸브의 벤트 포트에 I/O Link 비례 파일럿 밸브를 추가하여 설정압을 원격으로 제어할 것"
      - ": 기존 릴리프 밸브의 세팅압이 계통 최고압 제한(기계식 과압 보호) 역할을 유지하도록 할 것"
      - "- EonGate(원격 관리 게이트웨이)를 중심으로 PLC / HMI 없이 I/O Link 단독 통신으로 아래 기능을 구현할 것"
      - ": 작업자 제품 레시피별 치수 및 세팅압 설정 관리, 레시피 선택 시 설정압(하부레버 압력, 쵸핑압) 자동 변경"
      - ": 하부레버 ON/OFF 시에만 압력을 서서히 상승/하강(Soft Start 램프)시켜 완충 기능 수행"
      - ": 설정압 변경 인터록 및 사용자 권한 관리"
      - ": 압력 트랜스미터를 통한 실시간 압력 모니터링 및 지령·실압 이력 저장"
      - ": 작업자 운전 UI(현장 태블릿·PC) 및 원격 모니터링(사무실·기술지원) 제공"
      - "- MES 연계는 2단계 과제로 본 건 범위에서 제외하되, 추후 연계가 가능하도록 데이터 구조와 인터페이스를 고려하여 설계할 것"

      - "# 시스템 구성"
      - {image: img/pm22_eongate_arch.png, width_cm: 16, caption: EonGate 기반 시스템 구성도 (참고)}
      - table:
          header: [구 분, 구성품, 역 할]
          widths: [18, 43, 39]
          rows:
            - [쵸핑압, "비례 파일럿 밸브 1EA + 압력 트랜스미터 1EA (쵸핑 유압유니트)", 레시피별 설정압 제어 및 실압 측정]
            - [하부레버 압력, "비례 파일럿 밸브 1EA + 압력 트랜스미터 1EA (하부레버 유압유니트)", 레버 ON/OFF 시 램프 압력 제어 및 실압 측정]
            - [통신(마스터), "I/O Link 마스터 2식 (쵸핑측 / 하부레버측)", "밸브·트랜스미터와 M12 연결, EonGate와 Ethernet 연결"]
            - [게이트웨이, EonGate 원격 관리 게이트웨이 1식 (제어 함체 내 설치), "압력 지령 로직, 레시피, 램프, 인터록·권한, 이력 저장"]
            - [운전 / 감시, "작업자 운전 UI (현장 태블릿·PC), 원격 모니터링 (사무실·기술지원)", "레시피 선택·설정, 상태·알람 표시, 이력 조회"]
            - [확장(2단계), MES 연계, 본 건 범위 외]
      - "- 신호 흐름 : 작업자 운전 UI(레시피 선택) / 하부레버 ON/OFF → EonGate (압력 지령·램프 연산) → Ethernet → I/O Link 마스터 → 비례 파일럿 밸브"
      - ": 실압 : 압력 트랜스미터 → I/O Link 마스터 → EonGate (지령·실압 비교, 이력 저장) → 작업자 운전 UI / 원격 모니터링"
      - "- I/O Link 배선은 규격상 최대 20m이므로, 마스터는 쵸핑측(비드커터 약 4m)·하부레버측(약 15m) 유압유니트 인근에 각 1식씩 분산 설치하고, EonGate까지는 Ethernet으로 집선할 것"
      - "- 하부레버 ON/OFF 신호는 하부레버측 마스터의 DI 포트로 입력받는 것을 기본으로 할 것 [[확인 필요: 하부레버 ON/OFF 신호 취득 방식 (마스터 DI 입력 / 기존 설비 신호 연계)]]"
      - "- 압력 지령 및 램프 제어는 EonGate에서 수행하며, 작업자 운전 UI와 원격 모니터링은 EonGate에 접속하는 상위 단말로 구성할 것 (UI 단말 이상 시에도 EonGate의 압력 제어는 유지되어야 함)"

      - "# 기능 사양"
      - "## 제품 레시피별 압력 자동 변경"
      - "- 작업자 운전 UI에서 제품 레시피(외경/두께 구분)를 선택하면, EonGate가 해당 레시피의 설정압을 I/O Link를 통해 비례 파일럿 밸브에 자동 전달할 것"
      - "- 레시피별 설정압 항목 : 하부레버 설정압, 쵸핑압 설정압 (적용 대상 압력 항목은 협의하여 확정)"
      - table:
          header: [레시피, 외 경, 두 께, 설정압, 비 고]
          widths: [15, 18, 18, 21, 28]
          align: [c, c, c, c, l]
          rows:
            - [No. 01, 당사 제공, 당사 제공, 시운전 시 확정, 레시피 수량은 협의]
            - [No. 02, 당사 제공, 당사 제공, 시운전 시 확정, ""]
            - [… No. N, "", "", "", ""]
      - "- 레시피 설정압은 기존 릴리프 밸브 세팅압 이하 범위에서만 설정되도록 EonGate에서 상한/하한을 제한할 것"
      - "- 레시피 변경 후에도 EonGate 전원 차단/복귀 시 마지막 레시피와 설정값이 유지될 것"
      - "## 하부레버 ON/OFF 완충(Soft Start 램프) 제어"
      - "- 하부레버 ON 시 : 설정압 지령을 최저압에서 레시피 설정압까지 서서히 상승시킬 것"
      - "- 하부레버 OFF 시 : 설정압 지령을 현재 값에서 최저압까지 서서히 하강시킬 것"
      - "- 램프는 ON/OFF 천이 구간에만 적용하고, 설정압 도달 후 유지 구간 및 레시피 값 반영에는 적용하지 않아 제어 응답 지연이 없도록 할 것"
      - "- 램프업 / 램프다운 시간은 각각 작업자 운전 UI에서 설정/변경 가능할 것 (예상 Spec - 조정 범위 0.1 ~ 5.0초, 초기값은 시운전 시 확정, 상세 Spec 협의 必)"
      - "- 램프 곡선이 계단 형태로 나타나지 않도록 갱신 주기를 I/O Link 사이클 타임과 Ethernet 통신 주기를 고려하여 설정할 것 (갱신 주기 협의)"
      - "- 램프 진행 중 하부레버가 반대로 조작될 경우, 현재 압력값에서 목표 방향으로 연속 전환하여 압력이 급변하지 않도록 할 것"
      - "- 램프는 EonGate 로직에서 생성함을 기본으로 하며, 밸브 내부 램프 기능을 사용하는 경우 이중으로 램프가 걸리지 않도록 사전에 협의할 것"
      - "## 변경 인터록 및 권한 관리"
      - "- 하부레버 ON 중 레시피 변경 시의 처리(변경 금지 또는 OFF 후 적용)는 인터록으로 구성할 것 (방식은 협의 후 결정)"
      - "- 사용자 권한을 구분(작업자 : 레시피 선택 / 관리자 : 설정압·램프 시간 수정 등)하고, 원격 모니터링 단말에서는 조회만 가능하도록 할 것 (원격 설정 변경 허용 여부는 협의)"
      - "- 설정 변경 이력(일시, 사용자, 변경 항목, 변경 전/후 값)을 저장하여 조회 가능하도록 할 것"
      - "## 지령·실압 이력 저장"
      - "- 압력 지령값, 압력 트랜스미터 실압, 하부레버 상태, 선택 레시피, 이벤트·알람을 시간 정보와 함께 EonGate에 저장할 것"
      - "- 저장 주기는 램프 구간의 압력 파형을 확인할 수 있는 수준으로 하고, 저장 기간 및 백업(내보내기) 방법은 협의 후 확정할 것"
      - "- 지령값과 실압의 편차가 허용치를 초과하면 알람을 발생시킬 것 (허용치 및 판정 지연시간은 시운전 시 확정)"
      - "- 이력의 시간 정합을 위해 시간 동기화(NTP 등) 기능을 적용할 것"
      - "## 이상 시 동작 (Fail-safe)"
      - "- 비례 파일럿 밸브 무여자(전원 차단) 시 압력 상태, EonGate 다운·Ethernet 단절·I/O Link 단절 시 압력 상태를 사양서로 제출하고, 최고압으로 상승하는 구조는 적용 불가"
      - "- EonGate 또는 Ethernet 통신 단절 시 I/O Link 마스터의 통신 감시(Watchdog) 기능으로 밸브 출력을 미리 정한 안전 측 상태로 전환할 것 (안전 측 상태 : 최종값 유지 / 설정 안전압 / 최저압 중 유압회로 확인 후 협의하여 확정)"
      - "- 램프 진행 중 통신이 단절되더라도 중간 압력에서 불안정하게 정지하지 않고 안전 측 상태로 전환할 것"
      - "- 비상정지 및 설비 이상 시에는 램프를 적용하지 않고 즉시 안전 측으로 전환되도록 할 것"
      - "- 어떠한 고장 상태에서도 계통 압력은 기존 릴리프 밸브 세팅압을 초과하지 않을 것"
      - "- 이상 발생 시 작업자 운전 UI에 알람을 표시하고 이력으로 저장할 것"

      - "# 작업자 운전 UI 및 원격 모니터링"
      - "- 표시 항목 : 현재 선택 레시피, 설정압(지령), 실압, 하부레버 상태, 램프 진행 상태, I/O Link 마스터·포트별 통신 상태, EonGate 상태"
      - "- 조작 항목 : 레시피 선택, 레시피 설정값 수정, 램프 시간 설정 (권한 구분 적용)"
      - "- 진단 항목 : 밸브·트랜스미터 이벤트(발생/해제 시각 포함) 및 장치 상태(정상/점검 필요/사양 이탈/고장)를 알람 이력으로 저장하고 표시할 것"
      - "※ I/O Link 이벤트는 발생 시점에 1회만 전달되므로, 순간 이상도 놓치지 않도록 EonGate에서 래치 및 이력 처리할 것"
      - "- 작업자 운전 UI는 현장 태블릿·PC의 웹 브라우저 등 별도 설치 부담이 적은 방식을 기본으로 하고, 화면 구성은 협의 후 확정할 것"
      - "- 원격 모니터링은 사무실·기술지원 단말에서 실시간 상태 및 이력(추세) 조회가 가능하도록 할 것"

      - "# 구성품 선정 사양"
      - "- 비례 파일럿 밸브 : 기존 릴리프 밸브(쵸핑측 TCG20-03-F, 하부레버측 품번 확인 후 통보)의 벤트 포트에 연결 가능하고, 레시피 설정압 범위(당사 제공)를 제어할 수 있는 I/O Link 제품일 것"
      - "- 압력 트랜스미터 : I/O Link 제품으로 하고, 측정 범위는 기존 릴리프 세팅압 이상을 포함하며 맥동·서지에 대응 가능한 사양일 것"
      - "- 밸브·트랜스미터 선정 시 아래 자료를 제출하여 당사 승인 후 제작할 것"
      - ": IODD 파일, 데이터시트, 프로세스 데이터 구성(설정값/실제값/상태), 이벤트 코드표"
      - ": 지령-압력 특성(0%, 100% 시 압력값, 정/역특성), 무여자·통신 이상 시 압력 상태"
      - ": 소비 전류 및 포트 Class(A/B), 밸브 내부 램프 파라미터 유무"
      - "- I/O Link 마스터 : Ethernet 연결 마스터로 하고, 통신 감시(Watchdog) 및 단절 시 출력 안전값 설정 기능을 갖출 것"
      - "- 마스터 포트 배정(안)은 아래와 같음 (확정은 협의)"
      - table:
          header: [마스터, Port, 연결 대상, 비 고]
          widths: [20, 14, 36, 30]
          rows:
            - [쵸핑측, Port 1, 비례 파일럿 밸브 (쵸핑압), I/O Link 모드]
            - [^, Port 2, 압력 트랜스미터 (쵸핑압), I/O Link 모드]
            - [^, Port 3~, 예비, ""]
            - [하부레버측, Port 1, 비례 파일럿 밸브 (하부레버), I/O Link 모드]
            - [^, Port 2, 압력 트랜스미터 (하부레버), I/O Link 모드]
            - [^, Port 3, 하부레버 ON/OFF 신호, "DI 모드 (신호 취득 방식 확정 후)"]
            - [^, Port 4~, 예비, ""]
      - "- 마스터의 데이터 스토리지(파라미터 서버) 기능을 활성화하여, 밸브·트랜스미터 교체 시 설정이 자동 복원되도록 할 것"
      - "- EonGate : 산업용 사양(DIN 레일 또는 함체 고정형, DC 24V)으로 하고, 프로그램·레시피·이력 데이터를 비휘발성 저장장치에 보관하며 설정 백업/복원 기능을 갖출 것"
      - "- EonGate 선정 시 데이터시트, 소프트웨어 구성(압력 지령 로직, 레시피, 램프, 인터록, 이력), 지원 프로토콜, 태그 리스트(안)를 제출하여 당사 승인 후 적용할 것"
      - "- 제조사는 {sec:common}항 Common List의 유압 밸브/전기부품 제조사 기준으로 하되, 해당 사양이 없는 경우 협의 후 당사 승인을 받을 것"

      - "# 네트워크 및 보안"
      - "- I/O Link 마스터 ~ EonGate 간 제어망과 작업자 운전 UI·원격 모니터링이 접속하는 정보망을 분리하여 구성할 것 (네트워크 구성도 제출)"
      - "- EonGate·마스터의 초기 계정/비밀번호 변경, 불필요 포트·서비스 비활성화, 설정 백업 방법을 제공할 것"
      - "- 원격 모니터링 접속 경로 및 IP 체계는 당사 담당 확인 후 통보하며, 무선 통신(태블릿 Wi-Fi 등) 사용 시 사전 승인을 받을 것"
      - "- MES 연계(2단계)를 위해 EonGate는 표준 프로토콜(OPC UA, MQTT 등) 확장이 가능한 구조로 할 것"

      - "# 제작 및 정비 요건"
      - "- 마스터 Box 및 EonGate 제어 함체 입력 전원단에 퓨즈 또는 차단기를 설치하고, 충전부는 핑거세이프 커버로 보호할 것"
      - "- Box·함체 내 모든 금속 부품 및 DIN 레일은 PE 접지를 연결하고, 접지 연결 상태를 점검 항목에 포함할 것"
      - "- Port 번호, 전선 번호, 전원 정격을 라벨로 표기하고 배선은 덕트/타이로 고정하며 선단에는 페룰을 사용할 것"
      - "- 미사용 M12 포트에는 보호 캡을 설치하여 방진/방수 등급을 유지하고, 설치환경({sec:env}항)에 적합한 보호등급을 적용할 것"
      - "- 24V 전원 용량은 전 포트 사용 시 합계 전류에 여유를 두어 선정하고 발열을 고려할 것"
      - "- 정비 편의를 위해 마스터/전원/EonGate/네트워크 스위치는 개별 교체가 가능하도록 구성할 것"
      - "- 마스터 Box 및 EonGate 제어 함체 설치 위치는 I/O Link 배선 길이(최대 20m)를 고려하여 현장 확인 후 결정할 것 (설치 위치 담당자 협의 必)"
      - "- 현장 전기 배선 공사는 {sec:install}-1항 설치 범위에 따라 당사에서 시행하며, 수주처는 결선도 및 포트 배정표를 제공하고 결선 입회 및 통신 확인을 지원할 것"

      - "# 안전 기능 분리"
      - "- I/O Link 및 EonGate 신호는 안전 등급 신호가 아니므로, 설비 보호/인터록/비상정지는 이 경로에 의존하지 않고 기존 하드와이어 안전 회로를 유지할 것"
      - "- 기존 릴리프 밸브는 존치하여 기계식 과압 보호 기능을 유지하며, 비례 파일럿 밸브 및 램프 제어 고장 시에도 과압이 발생하지 않도록 할 것"

      - "# 시운전 및 검수 시험 항목"
      - table:
          header: [시험 항목, 시험 내용, 확인 사항]
          widths: [24, 48, 28]
          rows:
            - [레시피 압력 변경, 전체 레시피 선택 시 설정압 자동 반영 확인, "지령/실압 일치 (트랜스미터 기준)"]
            - [램프 업/다운, 하부레버 ON/OFF 시 압력 파형을 기록하고 즉시 인가 대비 충격 저감 확인, "압력 파형, 충격 육안 확인(당사 입회)"]
            - [연속 조작, 하부레버 ON/OFF 반복 및 램프 중 반대 조작, 압력 급변 없음]
            - [변경 인터록·권한, "하부레버 ON 중 레시피 변경 시도, 권한별 조작 범위 확인", 설정된 방식대로 동작]
            - [과압 제한, 상한 초과 설정 시도 및 밸브 최대 지령 시 계통 압력 확인, 기존 릴리프 세팅압 이하]
            - [통신 단절, "EonGate 전원 차단, Ethernet 분리, I/O Link 케이블 분리 시 거동 확인", "안전 측 전환, 알람 표시"]
            - [UI 단말 단절, 작업자 운전 UI·원격 모니터링 단말 종료 시 압력 제어 유지 확인, 제어 영향 없음]
            - [전원 차단/복귀, 전원 차단 후 복귀 시 압력 상태 및 레시피 유지, 이상 압력 상승 없음]
            - [이력 저장, 지령·실압 이력 및 설정 변경 이력 조회·내보내기, "누락 없음, 시간 정합"]
            - [이벤트/알람, 밸브·트랜스미터 이벤트 발생/해제의 UI 표시 및 이력, 순간 이상도 이력 저장]
            - [기기 교체, 밸브·트랜스미터 교체 후 설정 자동 복원 확인, 파라미터 복원]
            - [연속 가동, 최소/최대 외경 레시피 각각 연속 생산, "{sec:install}-3항 시운전 완료 기준 적용"]
      - "- 시험 결과(압력 파형 포함)는 Testing Report로 작성하여 제출할 것 ({sec:misc}-8항)"

      - "# 제출 문서"
      - "- 비례 파일럿 밸브/압력 트랜스미터/I/O Link 마스터/EonGate 사양서, IODD, 이벤트 코드표 및 알람 리스트"
      - "- Port 배정표, 결선도, 유압회로도(비례 파일럿 밸브 벤트 연결 포함), 레시피별 설정압 표"
      - "- 네트워크 구성도(제어망/정보망 분리), EonGate 태그 리스트, 작업자 운전 UI 화면 구성서"
      - "- EonGate 프로그램 및 설정 백업 파일, 기기 교체/설정 복원 절차서, 정비 점검 절차서, 통신 이상 시 점검 순서(LED 상태별 의미 포함)"

