detail_note: (상세 내용은 필히 담당자 협의 후 설계/제작할 것)
details:
  - title: 유압 회로 기본 구성
    blocks:
      - "1) 회로 구성 개요 : 기존 12M 태그웰더 유압유니트(24.5 MPa)로부터 분기하여, 아래 순서의 독립 감압 서브회로를 신설할 것"
      - ": [기존 유압원 P라인 분기] → [신규 매니폴드 블록 : 감압밸브 → 2차 릴리프밸브] → [솔레노이드밸브 4EA (실린더별 구성)] → [실린더별 유량조절밸브 + 카운터밸런스밸브] → [유압실린더 4EA (2EA/조 × 2조, 유압 실린더 및 터닝롤은 사급)]"
      - "2) 제어 단위 : 솔레노이드밸브 1EA가 유압실린더 1EA를 전담 제어하는 실린더별 독립 라인으로 구성할 것"
      - "3) 각 실린더 라인은 상호 독립적으로 작동 가능하여야 하며, 특정 라인(밸브)의 고장·정비가 타 실린더 작동에 영향을 주지 않는 회로로 구성할 것"
      - "4) 편하중 대응 : 파이프 진직도·진원도에 의해 조 내 한쪽 롤이 먼저 접촉하더라도, 반대측 실린더가 독립적으로 계속 상승하여 접촉 후 하중이 자연스럽게 재분배되는 구조(자기조정)로 작동할 것. 이때 먼저 정지한 라인에서 압력 이상 상승 등 유해 거동이 발생하지 않아야 함"
      - "5) T(리턴)라인은 배압이 최소화되도록 사이징하고, 기존 유압유니트 탱크로 리턴되도록 배관할 것"
  - title: 신규 매니폴드 블록 (감압회로 구조)
    blocks:
      - "1) 기존 유압원 작동압력(24.5 MPa)이 실린더 정격압력(14 MPa)을 초과하므로, 신규 매니폴드 블록은 직결을 금하고 감압회로 구조로 제작할 것"
      - "2) 감압밸브(Reducing Valve) : 세팅압은 11~12 MPa 범위에서 세팅하되 실린더 정격(14 MPa)을 절대 초과하지 않도록 할 것"
      - "3) 2차 릴리프밸브 : 감압밸브 고장 시에도 하류 압력이 실린더 정격을 초과하지 못하도록 별도의 릴리프밸브를 추가하여 이중 안전구조로 구성할 것 (세팅압력 14 MPa 이하)"
      - "4) 매니폴드 블록에는 감압 후 압력을 상시 확인할 수 있는 압력계 및 압력 계측 포트를 반영할 것"
      - "5) 매니폴드 블록의 통과 유량은 유압 실린더 2조의 최대 Stroke 상승 시간 6초 세팅 기준 최대 유량인 30L/min에 충분한 여유를 갖도록 사이징하고, 솔레노이드밸브 4EA를 탑재할 수 있는 스테이션 구성으로 제작할 것 (감압밸브·2차 릴리프밸브도 동일 유량 기준으로 선정)"
      - "6) 기존 유압유니트의 매니폴드 레일(마운팅) 공간·배관 여유를 현장 실측 후 설치 위치를 확정할 것 (설치 위치 담당자 협의 必, 기존 회로에 영향을 주지 않도록 분기·시공)"
  - title: 방향전환밸브 (솔레노이드밸브) — 실린더당 1EA (총 4EA)
    blocks:
      - "1) 실린더당 1EA, 총 4EA를 적용하며, 각 밸브는 동일 모델·동일 유량특성으로 선정하여 실린더 간 동조 오차를 최소화할 것"
      - "2) 형식 : 4포트 3위치(4/3-way), 중립 위치에서 실린더 포트가 차단되는 스풀 형식을 기본으로 하되, 상세 스풀 타입은 카운터밸런스밸브와의 조합(파일럿압 형성)을 고려하여 협의 후 결정할 것"
      - "3) 정전 및 비상정지 시 스프링 리턴에 의해 중립(차단) 위치로 복귀하는 구조일 것"
      - "4) 전원, 상호 등 기타 사항은 {sec:common}. Common List를 참고할 것"
  - title: 유량조절밸브 — 실린더당 1EA (총 4EA)
    blocks:
      - "1) 각 실린더 라인에 유량조절밸브를 설치하여 실린더별 승강 속도를 독립적으로 미세 조정 가능하게 할 것"
      - "2) 형식 : 부하 변동 시에도 좌우 속도 편차가 발생하지 않고 세팅 속도가 유지되도록 반드시 압력보상형을 적용할 것 (미터아웃(Meter-out) 방식을 기본으로 할 것)"
      - "3) 각 밸브는 동일 모델로 통일하고, 승강 속도 약 600mm/min(실린더당 약 7.5L/min, 풀스트로크 기준 약 6초)을 기준으로 세팅 가능한 기종을 선정할 것."
      - "4) 저속 구동 시 끊김 현상 없이 안정적으로 작동하도록 사양 선정할 것"
      - "5) 롤이 파이프에 접촉하는 순간/스트로크 끝단 도달 시 과도한 압력 스파이크·충격이 발생하지 않아야 하며, 실부하 시운전에서 접촉 충격이 과다할 경우 감속 대책(속도 하향 트림 또는 2단 속도 제어 등)을 당사와 협의하여 반영할 것"
  - title: 유압 배관 사양
    blocks:
      - "1) 배관 설계 압력은 해당 구간에서 발생 가능한 최대 압력 기준으로, 파괴압 기준 4배 이상 안전율이 확보되도록 배관재 설계할 것"
      - ": ① 감압 전 구간 (기존 유압원 분기점 ~ 감압밸브 입측) – 24.5MPa 기준"
      - ": ② 감압 후 구간 (감압밸브 출측 ~ 실린더) – 14MPa 기준"
      - "2) 배관 플랜지 연결은 용접 방식을 적용하고, 나사 연결은 계기 포트 등 최소 부위 외에는 사용을 지양할 것"
      - "3) 배관은 적정 간격으로 클램프 고정하여 진동에 의한 흔들림과 피로 파손을 방지하고, 진동원(펌프·솔밸브 전환)과 인접한 구간은 방진 클램프를 적용할 것"
  - title: 동조 방식 및 요구 성능
    blocks:
      - "1) 본 시스템의 1조 내 동조는 유량조절밸브 트림 방식을 기본으로 하며, 아래 조건으로 성능 확보할 것"
      - "① 솔레노이드밸브, 유량조절밸브, 배관(호스 길이·구경 포함)을 좌/우 실린더 2*2EA에 대해 최대한 대칭, 동일 사양으로 구성할 것"
      - "② 시운전 시 실린더별 실측 속도를 기준으로 유량조절밸브를 트림 조정하여 조 내 동조 편차를 허용범위 내로 맞출 것 (허용 편차는 담당자 협의 후 확정)"
      - "③ 최종 트림 세팅값을 기록·제출하고, 유량조절밸브에 세팅 고정 장치를 반영하여 임의 변경을 방지할 것"
      - "2) 본 설비의 동조 요구 수준은 파이프가 조 내 좌/우 롤에 안정적으로 얹히는 수준이며, 정밀 위치 동기(mm 단위)는 요구하지 않음. 편하중 시에는 {sec:detail}-1항 4)의 자기조정 메커니즘에 의해 하중이 재분배됨"
      - "3) 운전 중 마모·유온 변화 등에 의한 동조 편차 발생에 대비하여, 유지보수 시 재트림이 용이한 구조(조정부 접근성 확보)로 설계하고 재조정 절차를 매뉴얼에 포함할 것"
  - title: 카운터밸런스밸브 — 실린더당 1EA (총 4EA)
    blocks:
      - "1) 각 실린더의 부하측 포트에 카운터밸런스밸브를 설치하여, 정지 중 낙하 및 하강 시 하중 폭주 방지 기능을 구현할 것"
      - "2) 설치 위치 : 실린더 포트에 직결 또는 최대한 근접하게 설치하여, 밸브~실린더 간 배관(호스) 파손 시에도 실린더가 낙하하지 않는 구조로 할 것"
      - "3) 솔레노이드 신호와 무관하게 순수 유압·기계식으로 작동하여, 정전 시에도 하중 유지 기능이 상실되지 않을 것"
      - "4) 세팅압은 부하 유도압의 1.3배 수준을 기준으로 하되, 시운전 시 실부하 조건에서 조정·확정하고 세팅값을 기록·제출할 것"
      - "5) 파일럿비(Pilot Ratio)는 편하중 및 설정 승강 속도(약 600mm/min) 조건에서 채터링 없이 안정적으로 작동하는 사양으로 선정하고, 통과 유량(실린더당 약 7.4 L/min)에 충분한 정격을 가질 것"
  - title: 계측 및 모니터링
    blocks:
      - "1) 감압 후 공급라인 1개소 및 실린더 라인 4개소에 압력계를 설치하여, 조별·실린더별 압력(편하중 발생 여부)을 현장에서 상시 확인 가능하게 할 것"
      - "2) 압력계는 글리세린 충진형 등 진동 환경에 적합한 사양으로 하고, 점검·교체가 용이하도록 게이지 콕(차단밸브)을 함께 반영할 것"
  - title: 참고사진
    blocks:
      - {image: img/jcoe12m_ref1.png, width_cm: 9.5}
      - {image: img/jcoe12m_ref2.png, width_cm: 17}

install:
  - title: 설치 공사
    blocks:
      - "- 모든 설치 자재는 도급 기준이며, 사전 현장 확인 및 준비할 것 (공사 투입 1개월 전 필요 자재 리스트를 필히 제출할 것)"
      - "- 기존 유압유니트 P/T라인 분기 작업 시 기존 설비 정지 일정을 당사와 사전 협의하고, 작업 후 누유가 없도록 시공할 것"
      - "- 배관(호스) 시공 후 Flushing을 실시하여 회로 내 이물질을 제거한 후 실린더에 접속할 것"
      - "- 발생된 폐기물(폐유 포함)은 당사 지정 위치에 이적하며, 수주자측 자재 환경 폐기물은 수거/반출할 것"
      - "- 설비 설치 후 모든 볼트·피팅은 한번 더 체결/확인하여 풀림·누유가 없도록 할 것"
      - "- 시방의 내용과 변경 사항 발생 시 담당자와 협의 후 시행할 것"
  - title: 시운전
    blocks:
      - "- 시운전 : I/O Check, 압력 세팅(감압·2차 릴리프·카운터밸런스), 단동/연동 Test 및 세팅 최적화 외"
      - "- 무부하 상태에서 우선 시운전 후 점진적으로 부하를 늘려가며 확인할 것 (하기 필수 검증 항목 포함)"
      - "① 감압 후 압력이 세팅값(11~12 MPa)으로 유지되고, 어떠한 경우에도 14 MPa를 초과하지 않을 것"
      - "② 조 내 실린더 2EA의 승강 동조 편차가 허용범위 내일 것 (실린더별 실측 속도 기준 유량조절밸브 트림 조정으로 동조 확보, 허용치는 담당자 협의 후 확정)"
      - "③ 실린더 상승 후 펌프 정지(또는 밸브 중립) 상태에서 위치를 유지하고 자연 하강(Creep Down)이 없을 것"
      - "④ 비상정지·정전 모의 시 실린더 낙하가 없을 것"
      - "⑤ 승강 속도가 약 600mm/min(풀스트로크 약 6초) 수준으로 세팅되고 부하 변동 시에도 안정적으로 유지될 것, 파이프 접촉 순간 및 스트로크 끝단에서 과도한 충격·압력 스파이크가 없을 것 (과다 충격 발생 시 속도 하향 등 감속 대책 협의)"
      - "- 시운전 중 수정사항 발생 시 수주자는 즉각 조치할 것"
      - ": 보완 사항 및 문제점 발생시 적극 참여하여, 충분한 기능을 하도록 협조할 것"
      - "- 설비 시운전 중 수주자의 잘못으로 파손된 부품은 수주자의 무상수리가 원칙임"
      - "- 최종 확정된 각 밸브 세팅값(감압·릴리프·카운터밸런스·유량조절)은 기록표로 작성하여 제출할 것"
      - "- 모든 시운전의 완료는 최소 및 최대 외경, 최소 길이 및 최대 길이에 대해서 각각 1주일 불가동이 없이 생산이 가능할 때 시운전 완료로 규정함"
  - title: 공통 사항
    blocks:
      - "- 수주처에서 신설한 설비와 연계부분에 대한 부분 수정 등 일체를 포함함"
      - "- 상업생산 시작 후 4주간 작업자 2명을 배치하여 돌발 발생 문제점에 대해서 대응함"
      - "- 문제점 발생시 담당자와 협의하여 즉시 조치함"
      - "- 시방에 포함되지 않더라도 설비에 문제가 발견되면 수정 / 보완함"
      - "- 당사 규정에 의거하여 작업허가서, 크레인 대여, 산재 가입증명서 등 관련 서류 일체를 제출함"

misc:
  - 상기에 기술되지 않았지만, 생산에 필요한 장치 또는 시스템인 경우 수주처는 설계에 반영할 것.
  - 수정사항이 발생하였을 경우 수주자는 즉각 조치하며, 설치 중 수정된 사항에 대해 반드시 도면을 수정하여 제출한다.
  - 본 사양서 및 도면에 충분히 명기되지 않은 사항은 필히 당사의 승인을 득한 후 설계, 제작에 반영.
  - 제작 착수 전에 반드시 발주처의 승인을 득하고 실시한다.
  - 발주 후 전체 일정 계획표를 작성 제출하고, 매월 말일 진행현황을 작성 제출한다.
  - 입고 설비에 대한 모든 볼트는 고장력 볼트를 사용한다.
  - 모든 부품은 가공 후, 치수 및 성능 검사를 실시한 후에 조립한다. (검사 Report 제출 할 것)
  - 모든 단위 설비는 입고 전 Test를 실시한다 (Testing Report 제출 할 것)

docs:
  - 유압회로도 및 유압 부품 도면 일체
  - 모든 도면은 USB 파일 및 A3 출력 3부 제출 할 것.
  - 유압 셋팅 매뉴얼 작성 및 제출할 것 (파일 및 책자 3부)
